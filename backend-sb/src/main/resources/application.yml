server:
  port: 8080

spring:
  application:
    name: emomind

  datasource:
    url: jdbc:postgresql://${POSTGRES_SERVER:localhost}:${POSTGRES_PORT:5433}/${POSTGRES_DB:emomind}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: Asia/Shanghai
        format_sql: true
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    protocol: smtp
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: ${SMTP_TLS:true}

app:
  jwt:
    secret: ${SECRET_KEY:changeme-changeme-changeme-changeme}
    expiration: 691200000
  frontend:
    host: ${FRONTEND_HOST:http://localhost:5174}
  cors:
    origins: ${BACKEND_CORS_ORIGINS:http://localhost:5174}
  first-superuser:
    email: ${FIRST_SUPERUSER:}
    password: ${FIRST_SUPERUSER_PASSWORD:}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
