# Self-contained Traefik for single-host production deployment.
# Usage: docker compose -f compose.yml -f compose.traefik.yml up -d --build
services:
  proxy:
    image: traefik:3.6
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "8091:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-data:/data
    command:
      - --providers.docker
      - --providers.docker.constraints=Label(`traefik.constraint-label`, `traefik-public`)
      - --providers.docker.exposedbydefault=false
      - --entrypoints.http.address=:80
      - --entrypoints.https.address=:443
      - --accesslog
      - --log
      - --api
      - --api.insecure=true
      - --certificatesresolvers.le.acme.tlschallenge=true
      - --certificatesresolvers.le.acme.email=admin@example.com
      - --certificatesresolvers.le.acme.storage=/data/acme.json
      - --ping
    labels:
      - traefik.enable=true
      - traefik.constraint-label=traefik-public
      - traefik.http.middlewares.https-redirect.redirectscheme.scheme=https
    networks:
      - traefik-public
      - default
    healthcheck:
      test: ["CMD", "traefik", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  traefik-data:

networks:
  traefik-public:
    # Override compose.yml external: true so the network is auto-created locally
    external: false
