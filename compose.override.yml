services:

  db:
    restart: "no"
    ports:
      - "5433:5432"

  redis:
    restart: "no"
    ports:
      - "6390:6379"

  adminer:
    restart: "no"
    ports:
      - "8082:8080"

  backend:
    restart: "no"
    ports:
      - "8080:8080"
    build:
      context: .
      dockerfile: backend-sb/Dockerfile
    # For Spring Boot dev mode with hot reload, use:
    # command: ./mvnw spring-boot:run -Dspring-boot.run.jvmArguments="-Dspring.devtools.restart.enabled=true"
    # command: sleep infinity  # Infinite loop to keep container alive doing nothing
    develop:
      watch:
        - path: ./backend-sb/src
          action: sync
          target: /app/src
        - path: ./backend-sb/pom.xml
          action: rebuild
    env_file:
      - .env
    # environment:
    #   SMTP_HOST: "mailcatcher"
    #   SMTP_PORT: "1025"
    #   SMTP_TLS: "false"
    #   EMAILS_FROM_EMAIL: "noreply@example.com"

  ai-runtime:
    restart: "no"
    ports:
      - "8000:8000"
    environment:
      LANGGRAPH_LOG_LEVEL: DEBUG

  mailcatcher:
    image: schickling/mailcatcher
    ports:
      - "10801:1080"
      - "1026:1025"

  frontend:
    restart: "no"
    ports:
      - "5174:80"
    depends_on:
      backend:
        condition: service_healthy
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        - VITE_API_URL=http://localhost:5174
        - NODE_ENV=development
    volumes:
      - ./frontend/nginx-dev.conf:/etc/nginx/conf.d/default.conf
      - /dev/null:/etc/nginx/extra-conf.d/backend-not-found.conf

  playwright:
    build:
      context: .
      dockerfile: frontend/Dockerfile.playwright
      args:
        - VITE_API_URL=http://backend:8080
        - NODE_ENV=production
    ipc: host
    depends_on:
      - backend
      - mailcatcher
    env_file:
      - .env
    environment:
      - VITE_API_URL=http://backend:8080
      - MAILCATCHER_HOST=http://mailcatcher:1080
      # For the reports when run locally
      - PLAYWRIGHT_HTML_HOST=0.0.0.0
      - CI=${CI}
    volumes:
      - ./frontend/blob-report:/app/frontend/blob-report
      - ./frontend/test-results:/app/frontend/test-results
    ports:
      - 9323:9323
