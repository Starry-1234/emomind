        - id: dca5e1ca-dec4-434c-8c05-54129bd0acbd
          role: system
          text: 你是情感标签生成器，专门生成所有情感标签并按一定格式输出。
        - id: 78a3b9c6-7ce8-431b-8e48-3d09f99ec3d1
          role: user
          text: "```xml\n<instruction>\n你需要完成以下任务：\n1. 从提供的34个情感标签列表中随机选择10个不同的标签。列表如下：mood,\
            \ interest, sleep, anxiety, cognitive, stress, irritability, social, motivation,\
            \ energy, physical, coping, behavior, relationships, help_seeking, selfesteem,\
            \ mood_swings, withdrawal, future, somatic, suicidal, avoidance, panic,\
            \ rumination, family, adaptation, substance, alexithymia, support, sensitivity,\
            \ work, existential, trauma, impulsivity, reactivity, communication, selfimage,\
            \ dissociation, resilience。\n2. 确保选择的10个标签是随机且不重复的。\n3. 将选出的10个情感标签翻译成对应的中文。以下是每个标签的标准中文翻译对照表，请严格使用：\n\
            \   - mood: 情绪\n   - interest: 兴趣\n   - sleep: 睡眠\n   - anxiety: 焦虑\n\
            \   - cognitive: 认知\n   - stress: 压力\n   - irritability: 易怒\n   - social:\
            \ 社交\n   - motivation: 动力\n   - energy: 精力\n   - physical: 躯体\n   - coping:\
            \ 应对\n   - behavior: 行为\n   - relationships: 人际关系\n   - help_seeking:\
            \ 求助\n   - selfesteem: 自尊\n   - mood_swings: 情绪波动\n   - withdrawal: 退缩\n\
            \   - future: 未来\n   - somatic: 躯体化\n   - suicidal: 自杀意念\n   - avoidance:\
            \ 回避\n   - panic: 恐慌\n   - rumination: 反刍思维\n   - family: 家庭\n   - adaptation:\
            \ 适应\n   - substance: 物质使用\n   - alexithymia: 述情障碍\n   - support: 支持\n\
            \   - sensitivity: 敏感性\n   - work: 工作\n   - existential: 存在感\n   - trauma:\
            \ 创伤\n   - impulsivity: 冲动性\n   - reactivity: 反应性\n   - communication:\
            \ 沟通\n   - selfimage: 自我形象\n   - dissociation: 解离\n   - resilience: 心理韧性\n\
            4. 将翻译后的10个中文标签，用顿号（、）连接成一个字符串。\n5. 生成最终输出。输出格式可以用一下作为参考：“好的，以下是我为你推荐的10个情感标签，你可以选择其中任意数量的标签然后我将为你生成相关测试题：“"
        selected: false
        title: 情感标签生成器
        type: llm
