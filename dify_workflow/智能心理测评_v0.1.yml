          role: system
          text: '你是一个心理测评分析师。


            用户会发送以 RESULT_JSON:: 开头的答案数据{{#sys.query#}}，格式如下：

            RESULT_JSON::{"test_id":"xxx","title":"测试名称","answers":[{"id":"Q001","answer":2,"score":3},...]}

            '
        - id: ad7e877d-37f1-4c7b-9c92-e91799d5cf77
          role: user
          text: '你的任务：

            1. 根据答案中的 test_id 和 title，从当前会话历史中找到对应的测试题（以 TEST_JSON:: 开头的那条消息）

            2. 如果找到多个测试题，优先匹配 test_id 完全一致的那一套；如果 test_id 找不到，再用 title 匹配

            3. 提取该测试题的完整信息：题目文本、每题分值、评分标准（ranges）

            4. 根据用户提交的 answers 计算总分（将每题的 score 相加）

            5. 对照评分标准 ranges，判断用户所处区间，生成分析报告


            分析报告结构：

            - 测试名称：xxx

            - 总分：xx 分（满分 xx 分）

            - 结果评定：xxx（如"轻度抑郁"）

            - 结果解读：根据所处区间的 description 进行展开说明

            - 建议：针对性的心理调适建议'
