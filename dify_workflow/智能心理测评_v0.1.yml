        prompt_template:
        - id: efc9913d-02df-4d0c-ad09-195a2e89b208
          role: system
          text: 你的任务是将知识库检索到的题目数据，转换为标准 JSON 格式，供前端页面直接渲染使用。
        - id: 2b9a5551-995e-4adb-aaf2-a660019f37b1
          role: user
          text: "你的任务是将知识库检索到的题目数据{{#context#}}，转换为标准 JSON 格式，供前端页面直接渲染使用。\n\n## 输入说明\n\
            \n输入数据来自知识库检索结果，格式为多行 JSON，每行一条题目记录：\n- `id`：题目唯一标识符（如 \"anxiety_003\"\
            ）\n- `text`：题目文本\n- `dimension`：英文维度标签（如 \"anxiety\"）\n- `dimension_cn`：中文维度名（如\
            \ \"焦虑\"）\n- `keywords`：关键词列表（逗号分隔）\n\n## 处理步骤\n\n### 第 1 步：提取并归类\n- 从输入数据中提取所有题目\n\
            - 按 `dimension` 字段分组\n- 如果只有一个维度，生成单维度量表\n- 如果有多个维度，生成综合量表（title 用\"心理健康综合自评量表\"\
            ，dimension 用 \"composite\"）\n\n### 第 2 步：优化题目文本\n- 保持原意不变\n- 使语句更自然流畅、口语化\n\
            - 确保每题都是清晰的自我陈述句，适合 5 级频率评分\n- 删除重复或过于相似的题目（相似度 > 80% 只保留一题）\n\n### 第\
            \ 3 步：确定题型和选项\n所有题目统一使用 `likert` 类型，选项和分值固定为：\n- 选项：`[\"从不\", \"偶尔\",\
            \ \"有时\", \"经常\", \"总是\"]`\n- 分值：`[1, 2, 3, 4, 5]`\n\n### 第 4 步：生成评分标准\n\
            - `total_max` = 题目数量 × 5（每题最高 5 分）\n- 分为 3 个区间，每个区间给出中文名称和针对该维度的具体描述：\n\
            \n| 区间 | 范围 | label | 描述风格 |\n|------|------|-------|---------|\n| 低分\
            \ | 0 ~ total_max×33% | 正常范围 | 肯定当前状态良好，鼓励继续保持 |\n| 中分 | total_max×33%+1\
            \ ~ total_max×66% | 需要关注 | 指出存在一定困扰，建议自我调节 |\n| 高分 | total_max×66%+1 ~\
            \ total_max | 建议寻求帮助 | 强调问题较严重，建议寻求专业帮助 |\n\n- 如果是综合量表，描述需涵盖涉及的主要维度\n\
            - label 和 description 必须使用中文\n\n### 第 5 步：组装 JSON\n- `test_id`：格式为 `{dimension}_{题目数量}q`（如\
            \ `anxiety_7q`、`composite_21q`），不用时间戳\n- `title`：单维度用 `{dimension_cn}自评量表`（如\"\
            焦虑自评量表\"），多维度用\"心理健康综合自评量表\"\n- `dimension`：单维度用英文标签，多维度用 \"composite\"\
            \n- `description`：一句话说明测评目的和覆盖范围\n\n## 输出格式要求\n\n1. 必须输出合法的 JSON 字符串\n\
            2. 不得包含 Markdown 语法、XML 标签、代码块符号（如 ```）\n3. 不得有任何 JSON 之外的前缀文字或后缀说明\n\
            4. 字段名全部使用英文，内容使用中文\n5. 输出必须以 TEST_JSON:: 开头，紧跟 JSON 字符串，中间不加任何空格或换行\n\
            \n## JSON 结构\n\n{\n  \"test_id\": \"anxiety_7q\",\n  \"title\": \"焦虑自评量表\"\
            ,\n  \"dimension\": \"anxiety\",\n  \"description\": \"本量表用于评估您近期的焦虑状态，请根据实际感受如实作答。\"\
            ,\n  \"total_questions\": 7,\n  \"questions\": [\n    {\n      \"id\"\
            : \"anxiety_001\",\n      \"text\": \"你是否经常感到心跳加速或呼吸急促？\",\n      \"type\"\
            : \"likert\",\n      \"options\": [\"从不\", \"偶尔\", \"有时\", \"经常\", \"\
            总是\"],\n      \"scores\": [1, 2, 3, 4, 5]\n    }\n  ],\n  \"scoring\"\
            : {\n    \"total_max\": 35,\n    \"ranges\": [\n      {\"min\": 0, \"\
            max\": 11, \"label\": \"正常范围\", \"description\": \"您目前的焦虑水平在正常范围内，继续保持良好的生活习惯和积极心态。\"\
            },\n      {\"min\": 12, \"max\": 23, \"label\": \"需要关注\", \"description\"\
            : \"您存在一定程度的焦虑情绪，建议通过放松训练、规律运动等方式缓解，并持续关注自身状态。\"},\n      {\"min\": 24,\
            \ \"max\": 35, \"label\": \"建议寻求帮助\", \"description\": \"您的焦虑水平较高，可能已影响日常生活，建议尽早与专业心理咨询师沟通。\"\
            }\n    ]\n  }\n}\n\n## 多维度综合量表示例\n\n当知识库返回多个维度的题目时：\n\n{\n  \"test_id\"\
            : \"composite_21q\",\n  \"title\": \"心理健康综合自评量表\",\n  \"dimension\": \"\
            composite\",\n  \"description\": \"本量表综合评估您在焦虑、睡眠、认知等多个维度的心理状态，请根据近两周的实际感受如实作答。\"\
            ,\n  \"total_questions\": 21,\n  \"questions\": [\n    {\"id\": \"anxiety_001\"\
            , \"text\": \"...\", \"type\": \"likert\", \"options\": [\"从不\",\"偶尔\"\
            ,\"有时\",\"经常\",\"总是\"], \"scores\": [1,2,3,4,5]},\n    {\"id\": \"sleep_001\"\
            , \"text\": \"...\", \"type\": \"likert\", \"options\": [\"从不\",\"偶尔\"\
