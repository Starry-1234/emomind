            , \"text\": \"...\", \"type\": \"likert\", \"options\": [\"从不\",\"偶尔\"\
            ,\"有时\",\"经常\",\"总是\"], \"scores\": [1,2,3,4,5]}\n  ],\n  \"scoring\"\
            : {\n    \"total_max\": 105,\n    \"ranges\": [\n      {\"min\": 0, \"\
            max\": 34, \"label\": \"正常范围\", \"description\": \"您目前的心理状态总体良好，各维度表现均在正常范围内，请继续保持健康的生活方式。\"\
            },\n      {\"min\": 35, \"max\": 69, \"label\": \"需要关注\", \"description\"\
